name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build obfuscated dist/
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRYPTES }}'
          projectId: cryptes
          channelId: live

      # continue-on-error: le compte de service FIREBASE_SERVICE_ACCOUNT_CRYPTES
      # n'a pour l'instant que le rôle Hosting côté IAM Google Cloud, pas le
      # rôle "Firebase Rules Admin" nécessaire pour publier firestore.rules.
      # Tant que ce rôle n'est pas ajouté manuellement (IAM & Admin > compte
      # de service > Ajouter un rôle > Firebase Rules Admin), cette étape
      # échoue avec une 403 — on ne bloque pas le déploiement du site pour
      # autant. Une fois le rôle ajouté, cette étape réussira d'elle-même.
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRYPTES }}' > /tmp/firebase-sa.json
          npx firebase-tools@13 deploy --only firestore:rules --project cryptes
          rm -f /tmp/firebase-sa.json
