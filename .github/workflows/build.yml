name: Build – Android APK + Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable \
             $HOME/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Android SDK, keystore and editor settings
        run: |
          ANDROID_SDK=/usr/lib/android-sdk
          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          KEYSTORE=$HOME/.android/debug.keystore

          echo "=== Environment ==="
          echo "HOME=$HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          ls $ANDROID_SDK/build-tools/ 2>/dev/null || echo "no build-tools dir"
          java -version 2>&1 || true

          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Write settings to both possible paths Godot might use
          for CFGDIR in "$HOME/.config/godot" "/root/.config/godot"; do
            mkdir -p "$CFGDIR"
            cat > "$CFGDIR/editor_settings-4.tres" << EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$KEYSTORE"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          done

          echo "=== Editor settings ==="
          cat $HOME/.config/godot/editor_settings-4.tres

      - name: Create build directories
        run: mkdir -p build/web

      - name: Export Android debug APK
        run: godot --headless --export-debug "Android" build/CryptesEternelles-debug.apk 2>&1

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptesEternelles-Android
          path: build/CryptesEternelles-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Web artifact (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
