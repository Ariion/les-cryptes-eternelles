name: Build – Android APK + Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable \
             ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Android keystore and editor settings
        run: |
          mkdir -p /root/.android
          keytool -genkey -v \
            -keystore /root/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SETTINGS=/root/.config/godot/editor_settings-4.tres

          echo "=== Existing editor settings ==="
          if [ -f "$SETTINGS" ]; then cat "$SETTINGS"; else echo "(aucun)"; fi

          python3 - "$SETTINGS" << 'PYEOF'
          import sys, os, re
          path = sys.argv[1]
          os.makedirs(os.path.dirname(path), exist_ok=True)
          try:
              content = open(path).read()
          except FileNotFoundError:
              content = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          java_home = os.environ.get('JAVA_HOME', '')
          android_sdk = os.environ.get('ANDROID_SDK_ROOT', os.environ.get('ANDROID_HOME', '/usr/lib/android-sdk'))
          for key in ['export/android/debug_keystore', 'export/android/debug_keystore_user',
                      'export/android/debug_keystore_pass', 'export/android/android_sdk_path',
                      'export/android/java_sdk_path']:
              content = re.sub(rf'^{re.escape(key)} = .*\n', '', content, flags=re.MULTILINE)
          inject = (
              f'export/android/android_sdk_path = "{android_sdk}"\n'
              f'export/android/java_sdk_path = "{java_home}"\n'
              'export/android/debug_keystore = "/root/.android/debug.keystore"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n'
          )
          if '[resource]' in content:
              content = content.replace('[resource]\n', '[resource]\n' + inject, 1)
          else:
              content += inject
          open(path, 'w').write(content)
          print(content)
          PYEOF

      - name: Create build directories
        run: mkdir -p build/web

      - name: Export Android debug APK
        run: godot --headless --export-debug "Android" build/CryptesEternelles-debug.apk 2>&1

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptesEternelles-Android
          path: build/CryptesEternelles-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Web artifact (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4