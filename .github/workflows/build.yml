name: Build – Android APK + Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable \
             $HOME/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Android SDK, keystore and editor settings
        run: |
          ANDROID_SDK=/usr/lib/android-sdk
          JAVA=/usr/lib/jvm/java-17-openjdk-amd64
          KEYSTORE=$HOME/.android/debug.keystore

          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p $HOME/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
            "$ANDROID_SDK" "$JAVA" "$KEYSTORE" \
            > $HOME/.config/godot/editor_settings-4.tres

      - name: Create build directories
        run: mkdir -p build/web

      - name: Export Android debug APK
        run: godot --headless --export-debug "Android" build/CryptesEternelles-debug.apk 2>&1

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptesEternelles-Android
          path: build/CryptesEternelles-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Web artifact (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4