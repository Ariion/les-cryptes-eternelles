name: Build – Android APK + Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable \
             $HOME/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Android SDK, keystore and editor settings
        run: |
          KEYSTORE=$HOME/.android/debug.keystore
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))

          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p $HOME/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$KEYSTORE\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > $HOME/.config/godot/editor_settings-4.tres

          # Godot 4.2 reads keystore from preset options (not just editor settings)
          sed -i "s|^\[preset.0.options\]|\[preset.0.options\]\nkeystore/debug=\"$KEYSTORE\"\nkeystore/debug_user=\"androiddebugkey\"\nkeystore/debug_password=\"android\"|" export_presets.cfg

      - name: Fix Android SDK target SDK mismatch
        run: |
          ln -sf /usr/lib/android-sdk/platforms/android-33 \
                 /usr/lib/android-sdk/platforms/android-34
          ln -sf /usr/lib/android-sdk/build-tools/33.0.2 \
                 /usr/lib/android-sdk/build-tools/34.0.0

      - name: Create build directories
        run: mkdir -p build/web

      - name: Export Android APK
        run: godot --headless --export-debug "Android" build/CryptesEternelles.apk 2>&1

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html 2>&1

      - name: Patch Web build for GitHub Pages (Cross-Origin Isolation)
        run: |
          cp web_static/coi-serviceworker.js build/web/
          python3 - <<'EOF'
          html = open("build/web/index.html").read()
          sw_script = """<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('coi-serviceworker.js');
  if (!crossOriginIsolated) {
    navigator.serviceWorker.ready.then(() => location.reload());
  }
}
</script>
"""
          html = html.replace("<head>", "<head>\n" + sw_script, 1)
          open("build/web/index.html", "w").write(html)
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptesEternelles-Android
          path: build/CryptesEternelles.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Web artifact (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
