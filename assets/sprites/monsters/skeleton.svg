<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!-- Feet bones -->
  <rect x="28" y="130" width="18" height="10" rx="4" fill="#ddd"/>
  <rect x="54" y="130" width="18" height="10" rx="4" fill="#ddd"/>
  <!-- Leg bones -->
  <rect x="33" y="100" width="10" height="34" rx="4" fill="#e8e8e8"/>
  <rect x="57" y="100" width="10" height="34" rx="4" fill="#e8e8e8"/>
  <!-- Pelvis -->
  <ellipse cx="50" cy="100" rx="22" ry="10" fill="#d0d0d0"/>
  <!-- Spine -->
  <rect x="46" y="58" width="8" height="44" rx="3" fill="#d5d5d5"/>
  <!-- Ribcage -->
  <ellipse cx="50" cy="74" rx="22" ry="24" fill="none" stroke="#ccc" stroke-width="3"/>
  <line x1="34" y1="64" x2="34" y2="88" stroke="#ccc" stroke-width="2"/>
  <line x1="66" y1="64" x2="66" y2="88" stroke="#ccc" stroke-width="2"/>
  <line x1="28" y1="68" x2="72" y2="68" stroke="#bbb" stroke-width="1.5"/>
  <line x1="28" y1="74" x2="72" y2="74" stroke="#bbb" stroke-width="1.5"/>
  <line x1="28" y1="80" x2="72" y2="80" stroke="#bbb" stroke-width="1.5"/>
  <line x1="30" y1="86" x2="70" y2="86" stroke="#bbb" stroke-width="1.5"/>
  <!-- Arm bones -->
  <rect x="8" y="60" width="9" height="38" rx="4" fill="#d8d8d8" transform="rotate(8,12,79)"/>
  <rect x="14" y="96" width="9" height="28" rx="4" fill="#d0d0d0" transform="rotate(20,18,110)"/>
  <!-- Right arm with sword -->
  <rect x="83" y="56" width="9" height="38" rx="4" fill="#d8d8d8" transform="rotate(-12,87,75)"/>
  <rect x="76" y="92" width="9" height="28" rx="4" fill="#d0d0d0" transform="rotate(-25,80,106)"/>
  <rect x="62" y="28" width="5" height="34" rx="2" fill="#bbb"/>
  <rect x="56" y="38" width="17" height="4" rx="2" fill="#999"/>
  <rect x="62" y="22" width="5" height="10" rx="2" fill="#aaa"/>
  <!-- Skull -->
  <ellipse cx="50" cy="34" rx="22" ry="24" fill="#e5e5e5"/>
  <ellipse cx="50" cy="44" rx="16" ry="10" fill="#ddd"/>
  <!-- Eye sockets (dark hollow) -->
  <ellipse cx="38" cy="32" rx="8" ry="9" fill="#222"/>
  <ellipse cx="62" cy="32" rx="8" ry="9" fill="#222"/>
  <ellipse cx="38" cy="32" rx="4" ry="5" fill="#66f" opacity="0.7"/>
  <ellipse cx="62" cy="32" rx="4" ry="5" fill="#66f" opacity="0.7"/>
  <!-- Nose cavity -->
  <path d="M46 46 L50 52 L54 46" fill="#aaa"/>
  <!-- Teeth -->
  <rect x="36" y="54" width="5" height="8" rx="1" fill="#fff"/>
  <rect x="43" y="54" width="5" height="9" rx="1" fill="#fff"/>
  <rect x="50" y="54" width="5" height="9" rx="1" fill="#fff"/>
  <rect x="57" y="54" width="5" height="8" rx="1" fill="#fff"/>
</svg>
