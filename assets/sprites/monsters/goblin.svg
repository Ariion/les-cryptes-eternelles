<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!-- Legs -->
  <rect x="30" y="106" width="16" height="30" rx="6" fill="#2d6b1e"/>
  <rect x="54" y="106" width="16" height="30" rx="6" fill="#2d6b1e"/>
  <!-- Body -->
  <ellipse cx="50" cy="90" rx="26" ry="32" fill="#3d8c28"/>
  <!-- Left arm -->
  <rect x="10" y="72" width="14" height="34" rx="6" fill="#3d8c28" transform="rotate(15,17,89)"/>
  <!-- Right arm holding dagger -->
  <rect x="76" y="62" width="14" height="34" rx="6" fill="#3d8c28" transform="rotate(-20,83,79)"/>
  <rect x="86" y="44" width="5" height="26" rx="2" fill="#aaa"/>
  <rect x="82" y="42" width="13" height="4" rx="1" fill="#888"/>
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="28" ry="25" fill="#4db530"/>
  <!-- Pointy ears -->
  <polygon points="22,38 10,14 30,30" fill="#3d8c28"/>
  <polygon points="78,38 90,14 70,30" fill="#3d8c28"/>
  <!-- Eyes (yellow, menacing) -->
  <ellipse cx="38" cy="43" rx="8" ry="8" fill="#ffee00"/>
  <ellipse cx="62" cy="43" rx="8" ry="8" fill="#ffee00"/>
  <ellipse cx="39" cy="44" rx="4" ry="5" fill="#111"/>
  <ellipse cx="63" cy="44" rx="4" ry="5" fill="#111"/>
  <!-- Nose -->
  <ellipse cx="50" cy="54" rx="5" ry="3" fill="#2d6b1e"/>
  <!-- Mouth with fangs -->
  <path d="M34 62 Q50 72 66 62" stroke="#1a3f10" stroke-width="2.5" fill="none"/>
  <line x1="40" y1="63" x2="38" y2="70" stroke="#eee" stroke-width="2.5"/>
  <line x1="50" y1="66" x2="50" y2="74" stroke="#eee" stroke-width="2.5"/>
  <line x1="60" y1="63" x2="62" y2="70" stroke="#eee" stroke-width="2.5"/>
</svg>
