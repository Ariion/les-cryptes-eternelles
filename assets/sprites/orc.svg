<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Shadow -->
  <ellipse cx="32" cy="92" rx="20" ry="5" fill="#000" opacity="0.3"/>

  <!-- Legs -->
  <rect x="18" y="68" width="12" height="20" fill="#4a6030" rx="3"/>
  <rect x="34" y="68" width="12" height="20" fill="#4a6030" rx="3"/>
  <!-- Boots -->
  <rect x="16" y="80" width="14" height="10" fill="#2a3010" rx="3"/>
  <rect x="34" y="80" width="14" height="10" fill="#2a3010" rx="3"/>

  <!-- Body - large and muscular -->
  <ellipse cx="32" cy="52" rx="20" ry="20" fill="#5a7838"/>
  <!-- Chest detail -->
  <ellipse cx="32" cy="56" rx="14" ry="14" fill="#6a8840"/>
  <!-- Scar on chest -->
  <path d="M28 46 L36 60" stroke="#3a5020" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Leather armor straps -->
  <path d="M20 42 L32 36 L44 42" stroke="#5a3a10" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="28" y="36" width="8" height="30" fill="#5a3a10" opacity="0.4" rx="2"/>

  <!-- Right arm - very muscular -->
  <path d="M52 44 Q64 40 64 54 Q64 64 54 66 L50 62" fill="#5a7838" stroke="#4a6030" stroke-width="1"/>
  <!-- Axe -->
  <rect x="58" y="22" width="5" height="32" fill="#807060" rx="1"/>
  <path d="M58 22 L48 14 L48 36 Z" fill="#a09080"/>
  <path d="M63 22 L73 14 L73 36 Z" fill="#908070"/>
  <!-- Axe wrap -->
  <rect x="57" y="38" width="7" height="8" fill="#5a3a10" rx="1"/>

  <!-- Left arm -->
  <path d="M12 44 Q0 46 2 58 L8 62 L14 58 L12 50" fill="#5a7838" stroke="#4a6030" stroke-width="1"/>

  <!-- Neck - thick -->
  <rect x="24" y="36" width="16" height="10" fill="#5a7838" rx="3"/>

  <!-- Head - large and brutal -->
  <ellipse cx="32" cy="22" rx="20" ry="20" fill="#5a7838"/>

  <!-- Lower jaw / underbite -->
  <rect x="18" y="30" width="28" height="12" fill="#4a6030" rx="4"/>
  <!-- Tusks -->
  <rect x="21" y="38" width="5" height="10" fill="#e8e0c8" rx="2" transform="rotate(-5, 23, 43)"/>
  <rect x="38" y="38" width="5" height="10" fill="#e8e0c8" rx="2" transform="rotate(5, 41, 43)"/>

  <!-- Eyes - angry -->
  <ellipse cx="24" cy="18" rx="6" ry="5" fill="#cc4400"/>
  <ellipse cx="40" cy="18" rx="6" ry="5" fill="#cc4400"/>
  <!-- Angry eyebrows -->
  <line x1="18" y1="12" x2="30" y2="15" stroke="#2a3a10" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="12" x2="34" y2="15" stroke="#2a3a10" stroke-width="3" stroke-linecap="round"/>
  <!-- Pupils -->
  <ellipse cx="24" cy="19" rx="3" ry="3" fill="#200000"/>
  <ellipse cx="40" cy="19" rx="3" ry="3" fill="#200000"/>

  <!-- Nose - flat and wide -->
  <ellipse cx="32" cy="26" rx="6" ry="4" fill="#4a6030"/>
  <circle cx="29" cy="26" r="2" fill="#3a5020"/>
  <circle cx="35" cy="26" r="2" fill="#3a5020"/>

  <!-- Mohawk / top-knot -->
  <path d="M26 4 Q32 0 38 4 L36 14 Q32 10 28 14 Z" fill="#1a1010"/>
</svg>
