<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Shadow -->
  <ellipse cx="32" cy="92" rx="14" ry="3" fill="#000" opacity="0.3"/>

  <!-- Left leg bones -->
  <rect x="24" y="68" width="6" height="20" fill="#d8d0c0" rx="2"/>
  <ellipse cx="27" cy="68" rx="5" ry="4" fill="#e0d8c8"/>
  <ellipse cx="27" cy="88" rx="6" ry="4" fill="#c8c0b0"/>

  <!-- Right leg bones -->
  <rect x="34" y="68" width="6" height="20" fill="#d8d0c0" rx="2"/>
  <ellipse cx="37" cy="68" rx="5" ry="4" fill="#e0d8c8"/>
  <ellipse cx="37" cy="88" rx="6" ry="4" fill="#c8c0b0"/>

  <!-- Pelvis -->
  <ellipse cx="32" cy="68" rx="12" ry="6" fill="#c8c0b0"/>

  <!-- Spine -->
  <rect x="30" y="36" width="4" height="34" fill="#d8d0c0" rx="1"/>
  <!-- Vertebrae bumps -->
  <circle cx="32" cy="40" r="3" fill="#c8c0b0"/>
  <circle cx="32" cy="48" r="3" fill="#c8c0b0"/>
  <circle cx="32" cy="56" r="3" fill="#c8c0b0"/>
  <circle cx="32" cy="64" r="3" fill="#c8c0b0"/>

  <!-- Ribcage -->
  <ellipse cx="32" cy="52" rx="14" ry="16" fill="none" stroke="#d8d0c0" stroke-width="2"/>
  <!-- Ribs -->
  <path d="M32 40 Q20 44 18 52" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 44 Q19 49 18 56" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 48 Q20 54 19 60" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 40 Q44 44 46 52" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 44 Q45 49 46 56" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 48 Q44 54 45 60" stroke="#d0c8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Right arm (with sword) -->
  <rect x="46" y="36" width="5" height="28" fill="#d8d0c0" rx="2"/>
  <ellipse cx="48" cy="36" rx="4" ry="4" fill="#e0d8c8"/>
  <ellipse cx="48" cy="64" rx="4" ry="4" fill="#c8c0b0"/>
  <!-- Sword -->
  <rect x="50" y="16" width="4" height="34" fill="#b8b8c0" rx="1"/>
  <rect x="44" y="32" width="16" height="4" fill="#909098" rx="1"/>
  <rect x="51" y="12" width="4" height="8" fill="#707078" rx="1"/>

  <!-- Left arm -->
  <rect x="13" y="36" width="5" height="28" fill="#d8d0c0" rx="2"/>
  <ellipse cx="16" cy="36" rx="4" ry="4" fill="#e0d8c8"/>
  <ellipse cx="16" cy="64" rx="4" ry="4" fill="#c8c0b0"/>
  <!-- Hand holding shield -->
  <ellipse cx="16" cy="66" rx="5" ry="5" fill="#c8c0b0"/>
  <!-- Shield -->
  <rect x="2" y="46" width="14" height="20" fill="#6a4a20" rx="3"/>
  <rect x="4" y="48" width="10" height="16" fill="#7a5a28" rx="2"/>
  <ellipse cx="9" cy="56" rx="4" ry="4" fill="#cc2200" opacity="0.8"/>

  <!-- Neck -->
  <rect x="30" y="32" width="4" height="6" fill="#d8d0c0"/>

  <!-- Skull -->
  <ellipse cx="32" cy="20" rx="16" ry="18" fill="#e0d8c8"/>
  <!-- Skull lower jaw -->
  <rect x="22" y="30" width="20" height="10" fill="#d0c8b8" rx="2"/>
  <!-- Teeth -->
  <rect x="24" y="34" width="3" height="5" fill="#f0ece0" rx="1"/>
  <rect x="28" y="34" width="3" height="5" fill="#f0ece0" rx="1"/>
  <rect x="32" y="34" width="3" height="5" fill="#f0ece0" rx="1"/>
  <rect x="36" y="34" width="3" height="5" fill="#f0ece0" rx="1"/>

  <!-- Eye sockets -->
  <ellipse cx="24" cy="18" rx="6" ry="7" fill="#1a1010"/>
  <ellipse cx="40" cy="18" rx="6" ry="7" fill="#1a1010"/>
  <!-- Glowing eyes -->
  <ellipse cx="24" cy="18" rx="3" ry="4" fill="#44aaff" opacity="0.7"/>
  <ellipse cx="40" cy="18" rx="3" ry="4" fill="#44aaff" opacity="0.7"/>

  <!-- Nose cavity -->
  <path d="M30 26 L32 22 L34 26 L32 28 Z" fill="#1a1010"/>
</svg>
