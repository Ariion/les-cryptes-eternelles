<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Shadow -->
  <ellipse cx="32" cy="92" rx="14" ry="3" fill="#000" opacity="0.3"/>

  <!-- Legs -->
  <rect x="24" y="72" width="7" height="16" fill="#3a6a20" rx="2"/>
  <rect x="33" y="72" width="7" height="16" fill="#3a6a20" rx="2"/>
  <!-- Feet -->
  <ellipse cx="27" cy="88" rx="6" ry="4" fill="#2a4a18"/>
  <ellipse cx="36" cy="88" rx="6" ry="4" fill="#2a4a18"/>

  <!-- Body -->
  <ellipse cx="32" cy="58" rx="14" ry="16" fill="#4a8a28"/>
  <!-- Belly -->
  <ellipse cx="32" cy="62" rx="9" ry="10" fill="#5aa030"/>

  <!-- Ragged loincloth -->
  <path d="M20 66 L26 78 L32 70 L38 78 L44 66" fill="#5a3a10" opacity="0.8"/>

  <!-- Right arm (holding dagger) -->
  <path d="M46 50 Q56 48 58 56 Q56 60 50 58 L46 62" fill="#4a8a28" stroke="#3a6a20" stroke-width="1"/>
  <!-- Dagger -->
  <rect x="54" y="42" width="4" height="18" fill="#c0c0c0" rx="1" transform="rotate(20, 56, 50)"/>
  <rect x="50" y="52" width="12" height="3" fill="#806040" rx="1" transform="rotate(20, 56, 53)"/>

  <!-- Left arm -->
  <path d="M18 50 Q8 52 6 60 L12 64 L18 60" fill="#4a8a28" stroke="#3a6a20" stroke-width="1"/>

  <!-- Neck -->
  <rect x="28" y="38" width="8" height="8" fill="#4a8a28"/>

  <!-- Head -->
  <ellipse cx="32" cy="28" rx="16" ry="18" fill="#4a8a28"/>

  <!-- Pointy ears -->
  <polygon points="14,20 8,10 18,18" fill="#4a8a28"/>
  <polygon points="50,20 56,10 46,18" fill="#4a8a28"/>
  <polygon points="15,20 10,12 19,19" fill="#5aa030" opacity="0.6"/>
  <polygon points="49,20 54,12 45,19" fill="#5aa030" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="25" cy="26" rx="5" ry="6" fill="#cc2200"/>
  <ellipse cx="39" cy="26" rx="5" ry="6" fill="#cc2200"/>
  <ellipse cx="25" cy="27" rx="3" ry="4" fill="#ff0000"/>
  <ellipse cx="39" cy="27" rx="3" ry="4" fill="#ff0000"/>
  <ellipse cx="26" cy="26" rx="2" ry="2.5" fill="#200000"/>
  <ellipse cx="40" cy="26" rx="2" ry="2.5" fill="#200000"/>

  <!-- Nose -->
  <ellipse cx="32" cy="34" rx="4" ry="3" fill="#3a6a20"/>
  <circle cx="30" cy="34" r="1.5" fill="#2a4a18"/>
  <circle cx="34" cy="34" r="1.5" fill="#2a4a18"/>

  <!-- Mouth / grin -->
  <path d="M24 40 Q32 46 40 40" stroke="#1a3a10" stroke-width="2" fill="none"/>
  <!-- Teeth -->
  <rect x="27" y="40" width="3" height="4" fill="#e8e8e8" rx="1"/>
  <rect x="31" y="40" width="3" height="4" fill="#e8e8e8" rx="1"/>
  <rect x="35" y="40" width="3" height="4" fill="#e8e8e8" rx="1"/>
</svg>
