<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Aura glow -->
  <ellipse cx="32" cy="48" rx="32" ry="48" fill="#6600aa" opacity="0.12"/>

  <!-- Shadow -->
  <ellipse cx="32" cy="93" rx="22" ry="5" fill="#000" opacity="0.4"/>

  <!-- Legs - armored dark -->
  <rect x="17" y="66" width="12" height="24" fill="#2a1a40" rx="3"/>
  <rect x="35" y="66" width="12" height="24" fill="#2a1a40" rx="3"/>
  <!-- Leg armor plates -->
  <rect x="16" y="68" width="14" height="8" fill="#3a2050" rx="2"/>
  <rect x="34" y="68" width="14" height="8" fill="#3a2050" rx="2"/>
  <!-- Boots -->
  <rect x="14" y="82" width="16" height="10" fill="#1a0a28" rx="3"/>
  <rect x="34" y="82" width="16" height="10" fill="#1a0a28" rx="3"/>
  <!-- Boot spikes -->
  <polygon points="16,82 20,76 24,82" fill="#cc00ff" opacity="0.6"/>
  <polygon points="40,82 44,76 48,82" fill="#cc00ff" opacity="0.6"/>

  <!-- Cloak/robe -->
  <path d="M12 44 L6 90 L32 82 L58 90 L52 44" fill="#1a0a30" opacity="0.9"/>
  <!-- Cloak dark panels -->
  <path d="M12 44 L8 85 L32 78" fill="#220a3a" opacity="0.7"/>

  <!-- Body - armored -->
  <ellipse cx="32" cy="50" rx="18" ry="22" fill="#2a1a40"/>
  <!-- Chest armor -->
  <rect x="18" y="36" width="28" height="28" fill="#3a2050" rx="4"/>
  <!-- Chest runes -->
  <circle cx="32" cy="50" r="8" fill="none" stroke="#cc00ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="32" cy="50" r="4" fill="#aa00dd" opacity="0.6"/>
  <!-- Armor ridges -->
  <rect x="20" y="38" width="24" height="3" fill="#4a2860" rx="1"/>
  <rect x="20" y="56" width="24" height="3" fill="#4a2860" rx="1"/>

  <!-- Shoulder pauldrons -->
  <ellipse cx="12" cy="40" rx="10" ry="8" fill="#3a2050"/>
  <ellipse cx="52" cy="40" rx="10" ry="8" fill="#3a2050"/>
  <!-- Shoulder spikes -->
  <polygon points="4,36 8,28 12,36" fill="#cc00ff" opacity="0.8"/>
  <polygon points="52,36 56,28 60,36" fill="#cc00ff" opacity="0.8"/>

  <!-- Right arm with staff -->
  <rect x="50" y="38" width="8" height="26" fill="#2a1a40" rx="3"/>
  <!-- Staff -->
  <rect x="55" y="4" width="5" height="50" fill="#4a2860" rx="2"/>
  <!-- Staff orb -->
  <circle cx="57" cy="8" r="10" fill="#220a3a"/>
  <circle cx="57" cy="8" r="7" fill="#6600aa" opacity="0.8"/>
  <circle cx="57" cy="8" r="4" fill="#cc00ff" opacity="0.9"/>
  <circle cx="55" cy="6" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Left arm -->
  <rect x="6" y="38" width="8" height="26" fill="#2a1a40" rx="3"/>
  <!-- Clawed hand -->
  <path d="M6 64 L2 70 L6 68 L5 74 L9 69 L10 75 L12 68 L14 64" fill="#2a1a40"/>

  <!-- Neck -->
  <rect x="26" y="28" width="12" height="10" fill="#2a1a40" rx="2"/>

  <!-- Head -->
  <ellipse cx="32" cy="18" rx="18" ry="18" fill="#2a1a40"/>

  <!-- Demon horns -->
  <path d="M16 12 Q10 2 14 -2 Q16 6 22 12" fill="#1a0a28"/>
  <path d="M48 12 Q54 2 50 -2 Q48 6 42 12" fill="#1a0a28"/>
  <!-- Horn glow tips -->
  <path d="M14 -2 Q16 2 18 6" stroke="#cc00ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M50 -2 Q48 2 46 6" stroke="#cc00ff" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Crown -->
  <rect x="16" y="6" width="32" height="8" fill="#4a2860" rx="1"/>
  <polygon points="20,6 23,0 26,6" fill="#6600aa"/>
  <polygon points="29,6 32,0 35,6" fill="#8800cc"/>
  <polygon points="38,6 41,0 44,6" fill="#6600aa"/>
  <!-- Crown gems -->
  <circle cx="23" cy="2" r="2" fill="#ff00aa"/>
  <circle cx="32" cy="2" r="2.5" fill="#cc00ff"/>
  <circle cx="41" cy="2" r="2" fill="#ff00aa"/>

  <!-- Mask / face -->
  <rect x="18" y="14" width="28" height="16" fill="#1a0a28" rx="3"/>
  <!-- Glowing eyes -->
  <ellipse cx="24" cy="20" rx="5" ry="5" fill="#6600aa"/>
  <ellipse cx="40" cy="20" rx="5" ry="5" fill="#6600aa"/>
  <ellipse cx="24" cy="20" rx="3" ry="3" fill="#cc00ff"/>
  <ellipse cx="40" cy="20" rx="3" ry="3" fill="#cc00ff"/>
  <ellipse cx="24" cy="20" rx="1.5" ry="1.5" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="40" cy="20" rx="1.5" ry="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Mask details -->
  <path d="M22 26 Q32 32 42 26" stroke="#3a2050" stroke-width="1.5" fill="none"/>
</svg>
