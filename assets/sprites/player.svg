<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Shadow -->
  <ellipse cx="32" cy="92" rx="18" ry="4" fill="#000" opacity="0.3"/>

  <!-- Legs -->
  <rect x="22" y="72" width="8" height="18" fill="#2a4a7a" rx="2"/>
  <rect x="34" y="72" width="8" height="18" fill="#2a4a7a" rx="2"/>
  <!-- Boots -->
  <rect x="20" y="84" width="12" height="8" fill="#1a2a40" rx="2"/>
  <rect x="32" y="84" width="12" height="8" fill="#1a2a40" rx="2"/>

  <!-- Body / Chest armor -->
  <rect x="18" y="42" width="28" height="32" fill="#4a72b0" rx="4"/>
  <!-- Chest plate -->
  <rect x="22" y="46" width="20" height="22" fill="#5a88cc" rx="3"/>
  <!-- Chest center line -->
  <rect x="31" y="48" width="2" height="18" fill="#4070aa" rx="1"/>
  <!-- Shoulder pads -->
  <rect x="10" y="42" width="12" height="10" fill="#6090dd" rx="3"/>
  <rect x="42" y="42" width="12" height="10" fill="#6090dd" rx="3"/>

  <!-- Cape -->
  <path d="M18 48 L8 80 L20 74 L18 78 L28 74" fill="#7030a0" opacity="0.8"/>

  <!-- Sword arm (right) -->
  <rect x="44" y="48" width="8" height="28" fill="#5a88cc" rx="3"/>
  <!-- Sword -->
  <rect x="50" y="30" width="5" height="36" fill="#c0c8d8" rx="1"/>
  <rect x="44" y="44" width="17" height="5" fill="#a0a8b8" rx="1"/>
  <rect x="52" y="26" width="5" height="8" fill="#8898b0" rx="1"/>

  <!-- Shield arm (left) -->
  <rect x="12" y="48" width="8" height="24" fill="#5a88cc" rx="3"/>
  <!-- Shield -->
  <rect x="2" y="44" width="16" height="22" fill="#3060a0" rx="3"/>
  <rect x="4" y="46" width="12" height="18" fill="#4070b8" rx="2"/>
  <!-- Shield emblem -->
  <polygon points="10,49 13,55 10,61 7,55" fill="#ffd700" opacity="0.9"/>

  <!-- Neck -->
  <rect x="28" y="36" width="8" height="8" fill="#e8c898"/>

  <!-- Helmet -->
  <rect x="18" y="14" width="28" height="26" fill="#5a88cc" rx="4"/>
  <!-- Visor -->
  <rect x="20" y="26" width="24" height="10" fill="#1a2a40" rx="2"/>
  <!-- Eye slits -->
  <rect x="22" y="29" width="8" height="3" fill="#4090ff" opacity="0.8" rx="1"/>
  <rect x="34" y="29" width="8" height="3" fill="#4090ff" opacity="0.8" rx="1"/>
  <!-- Helmet plume -->
  <path d="M32 8 Q28 2 24 6 Q28 10 32 14 Q36 10 40 6 Q36 2 32 8Z" fill="#cc3030"/>
  <!-- Helmet ridge -->
  <rect x="30" y="14" width="4" height="12" fill="#6898dd" rx="1"/>
