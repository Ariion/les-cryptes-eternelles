<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Dark background -->
  <rect width="390" height="844" fill="#0a0610"/>

  <!-- Stone floor tiles -->
  <rect y="620" width="390" height="224" fill="#1a1520"/>
  <!-- Floor lines -->
  <line x1="0" y1="640" x2="390" y2="640" stroke="#252030" stroke-width="2"/>
  <line x1="0" y1="680" x2="390" y2="680" stroke="#252030" stroke-width="2"/>
  <line x1="0" y1="720" x2="390" y2="720" stroke="#252030" stroke-width="2"/>
  <line x1="0" y1="760" x2="390" y2="760" stroke="#252030" stroke-width="2"/>
  <line x1="65" y1="620" x2="65" y2="844" stroke="#252030" stroke-width="2"/>
  <line x1="130" y1="620" x2="130" y2="844" stroke="#252030" stroke-width="2"/>
  <line x1="195" y1="620" x2="195" y2="844" stroke="#252030" stroke-width="2"/>
  <line x1="260" y1="620" x2="260" y2="844" stroke="#252030" stroke-width="2"/>
  <line x1="325" y1="620" x2="325" y2="844" stroke="#252030" stroke-width="2"/>

  <!-- Back wall stone blocks -->
  <rect y="0" width="390" height="620" fill="#110e18"/>
  <!-- Wall stones -->
  <g stroke="#1e1a28" stroke-width="1.5" fill="none">
    <!-- Row 1 -->
    <rect x="0" y="520" width="78" height="40"/>
    <rect x="78" y="520" width="78" height="40"/>
    <rect x="156" y="520" width="78" height="40"/>
    <rect x="234" y="520" width="78" height="40"/>
    <rect x="312" y="520" width="78" height="40"/>
    <!-- Row 2 (offset) -->
    <rect x="-39" y="480" width="78" height="40"/>
    <rect x="39" y="480" width="78" height="40"/>
    <rect x="117" y="480" width="78" height="40"/>
    <rect x="195" y="480" width="78" height="40"/>
    <rect x="273" y="480" width="78" height="40"/>
    <rect x="351" y="480" width="78" height="40"/>
    <!-- Row 3 -->
    <rect x="0" y="440" width="78" height="40"/>
    <rect x="78" y="440" width="78" height="40"/>
    <rect x="156" y="440" width="78" height="40"/>
    <rect x="234" y="440" width="78" height="40"/>
    <rect x="312" y="440" width="78" height="40"/>
    <!-- Row 4 (offset) -->
    <rect x="-39" y="400" width="78" height="40"/>
    <rect x="39" y="400" width="78" height="40"/>
    <rect x="117" y="400" width="78" height="40"/>
    <rect x="195" y="400" width="78" height="40"/>
    <rect x="273" y="400" width="78" height="40"/>
    <rect x="351" y="400" width="78" height="40"/>
  </g>

  <!-- Left wall torch -->
  <g transform="translate(30, 360)">
    <!-- Torch bracket -->
    <rect x="-4" y="10" width="8" height="20" fill="#3a2a10" rx="2"/>
    <rect x="-8" y="6" width="16" height="6" fill="#4a3820" rx="1"/>
    <!-- Flame -->
    <ellipse cx="0" cy="-4" rx="8" ry="12" fill="#ff6b00" opacity="0.9"/>
    <ellipse cx="2" cy="-8" rx="5" ry="8" fill="#ffaa00" opacity="0.8"/>
    <ellipse cx="-1" cy="-12" rx="3" ry="6" fill="#ffdd44" opacity="0.7"/>
    <!-- Glow -->
    <circle cx="0" cy="0" r="40" fill="#ff6b00" opacity="0.06"/>
  </g>

  <!-- Right wall torch -->
  <g transform="translate(360, 360)">
    <rect x="-4" y="10" width="8" height="20" fill="#3a2a10" rx="2"/>
    <rect x="-8" y="6" width="16" height="6" fill="#4a3820" rx="1"/>
    <ellipse cx="0" cy="-4" rx="8" ry="12" fill="#ff6b00" opacity="0.9"/>
    <ellipse cx="2" cy="-8" rx="5" ry="8" fill="#ffaa00" opacity="0.8"/>
    <ellipse cx="-1" cy="-12" rx="3" ry="6" fill="#ffdd44" opacity="0.7"/>
    <circle cx="0" cy="0" r="40" fill="#ff6b00" opacity="0.06"/>
  </g>

  <!-- Floor/wall junction shadow -->
  <rect y="610" width="390" height="20" fill="url(#shadowGrad)"/>
  <defs>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient light from above -->
  <ellipse cx="195" cy="0" rx="200" ry="100" fill="#3a2060" opacity="0.15"/>
</svg>
